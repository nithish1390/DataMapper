<div style="height: 100vh; display: flex; flex-direction: column;">

  <!-- ===================== TOP BAR ===================== -->
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 9px 16px;
              background: var(--panel); border-bottom: 1px solid var(--border); flex-wrap: wrap; gap: 8px; flex-shrink: 0;">
    <div style="display: flex; align-items: center; gap: 9px;">
      <svg viewBox="0 0 32 32" fill="none" style="width: 24px; height: 24px;">
        <path d="M3 10c4 0 4 6 8 6s4-6 8-6 4 6 8 6" stroke="var(--wire)" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M3 20c4 0 4 6 8 6s4-6 8-6 4 6 8 6" stroke="var(--accent)" stroke-width="2.4" stroke-linecap="round"/>
      </svg>
      <div style="display: flex; flex-direction: column; line-height: 1.1;">
        <strong style="font-family: var(--display); font-weight: 700; font-size: 17px;">MapSheet AI</strong>
        <span style="font-size: 10.5px; color: var(--ink-soft);">AI data mapping · Excel mapping sheets</span>
      </div>
    </div>
    <div style="display: flex; gap: 6px; align-items: center; flex-wrap: wrap;">
      <button class="ghost session-pill" (click)="sessionsUi.open()" title="Sessions: name, save, open">
        🗂 {{ workspace.sessionName() }}<span *ngIf="workspace.unsaved()" class="unsaved-dot" title="Unsaved changes">●</span>
      </button>
      <button class="ghost" (click)="sheetModal.show()">📄 Import mapping sheet</button>
      <button class="ghost" (click)="customFns.open()">ƒ Custom functions<span *ngIf="workspace.libraries().length"> ({{ workspace.libraries().length }})</span></button>
      <button class="ghost" (click)="exportSheet()">⬇ Export mapping sheet</button>
      <button class="ghost" (click)="validate()">✓ Validate</button>
      <app-theme-picker></app-theme-picker>
      <button class="ghost" (click)="settingsModal.show()">⚙ Settings</button>
      <button class="primary" (click)="downloadProject()">⬇ Download project</button>
    </div>
  </div>

  <!-- ===================== MAPPING ROW ===================== -->
  <div style="display: flex; flex: 1; min-height: 120px; position: relative;">
    <app-mapping-lines></app-mapping-lines>
    <div #railSource [style.flexBasis.px]="leftWidth()" style="flex-shrink: 0; min-width: 220px; max-width: 640px; background: var(--panel); display: flex; flex-direction: column; overflow: hidden;">
      <app-source-panel style="display: flex; flex-direction: column; height: 100%;"></app-source-panel>
    </div>

    <div style="width: 6px; flex-shrink: 0; cursor: col-resize; background: var(--border); opacity: .4;"
         (mousedown)="startDragSplitter($event, 'left')"></div>

    <div style="flex: 1; min-width: 280px; overflow: hidden; background-color: var(--bg);">
      <app-formula-builder></app-formula-builder>
    </div>

    <div style="width: 6px; flex-shrink: 0; cursor: col-resize; background: var(--border); opacity: .4;"
         (mousedown)="startDragSplitter($event, 'right')"></div>

    <div #railTarget [style.flexBasis.px]="rightWidth()" style="flex-shrink: 0; min-width: 260px; max-width: 1100px; background: var(--panel); display: flex; flex-direction: column; overflow: hidden; border-left: 1px solid var(--border);">
      <app-target-panel style="display: flex; flex-direction: column; height: 100%;"></app-target-panel>
    </div>
  </div>

  <!-- ===================== BOTTOM PANEL ===================== -->
  <div style="height: 6px; flex-shrink: 0; cursor: row-resize; background: var(--border); opacity: .5;"
       (mousedown)="startDragBottom($event)"></div>

  <div #bottomPanel [style.flexBasis.px]="bottomHeight()" style="flex-shrink: 0; background: var(--panel); border-top: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden;">
    <app-bottom-panel style="display: flex; flex-direction: column; height: 100%; overflow: hidden;"></app-bottom-panel>
  </div>
</div>

<app-chat-drawer></app-chat-drawer>
<app-settings-modal></app-settings-modal>
<app-sheet-import-modal></app-sheet-import-modal>
<app-context-menu></app-context-menu>
<app-custom-functions-modal></app-custom-functions-modal>
<app-validation-modal></app-validation-modal>
<app-sessions-modal></app-sessions-modal>
<app-confirm-dialog></app-confirm-dialog>
